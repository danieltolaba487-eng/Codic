<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Códice</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#16151f">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #16151f;
    --ink-2: #1f1e2c;
    --ink-3: #2a2938;
    --bone: #ece6d9;
    --bone-dim: #a9a396;
    --violet: #8d7bf0;
    --gold: #c9a876;
    --line: #38364a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--ink);
    color: var(--bone);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 900px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 28px 24px 20px;
    border-bottom: 1px solid var(--line);
  }
  header .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--gold);
  }
  header h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 32px;
    margin-top: 4px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .persona-btn {
    height: 40px;
    padding: 0 14px;
    border-radius: 20px;
    background: var(--ink-2);
    border: 1px solid var(--line);
    color: var(--gold);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.05em;
    cursor: pointer;
    flex-shrink: 0;
    white-space: nowrap;
  }
  .persona-btn.set { border-color: var(--gold); }
  .persona-banner {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--ink-2);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 10px 14px;
    margin-bottom: 16px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--bone-dim);
  }
  .persona-banner b { color: var(--gold); font-family: 'Inter', sans-serif; }
  .persona-banner span { margin-left: auto; color: var(--violet); cursor: pointer; }

  .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .tab-btn {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    padding: 8px 16px;
    border-radius: 20px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--bone-dim);
    cursor: pointer;
  }
  .tab-btn.active { background: var(--violet); color: var(--ink); border-color: var(--violet); }

  .field select {
    width: 100%;
    background: var(--ink-2);
    border: 1px solid var(--line);
    border-radius: 4px;
    color: var(--bone);
    padding: 11px 12px;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
  }
  main { flex: 1; padding: 20px; }

  /* --- Roster --- */
  .roster { display: flex; flex-direction: column; gap: 10px; }
  .roster-item {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 16px;
    background: var(--ink-2);
    border: 1px solid var(--line);
    border-radius: 4px;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .roster-item:hover { border-color: var(--violet); }
  .sigil {
    width: 40px; height: 40px;
    border-radius: 3px;
    flex-shrink: 0;
  }
  .roster-item .meta { flex: 1; min-width: 0; }
  .roster-item .name { font-family: 'Fraunces', serif; font-size: 17px; font-weight: 600; }
  .roster-item .sub { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--bone-dim); margin-top: 2px; }
  .roster-item .arrow { color: var(--bone-dim); font-size: 18px; }
  .delete-btn {
    background: none;
    border: none;
    font-size: 15px;
    opacity: 0.5;
    padding: 4px;
    cursor: pointer;
  }
  .delete-btn:hover { opacity: 1; }

  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--bone-dim);
  }
  .empty p { font-family: 'JetBrains Mono', monospace; font-size: 13px; margin-top: 6px; }

  .fab {
    position: fixed;
    bottom: 24px; right: calc(50% - 450px + 24px);
    background: var(--violet);
    color: var(--ink);
    border: none;
    width: 54px; height: 54px;
    border-radius: 50%;
    font-size: 26px;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(141,123,240,0.4);
  }
  @media (max-width: 900px) {
    .fab { right: 24px; }
  }

  /* --- Form --- */
  .field { margin-bottom: 18px; }
  .field label {
    display: block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 6px;
  }
  .field input, .field textarea {
    width: 100%;
    background: var(--ink-2);
    border: 1px solid var(--line);
    border-radius: 4px;
    color: var(--bone);
    padding: 11px 12px;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    resize: vertical;
  }
  .field input:focus, .field textarea:focus {
    outline: none;
    border-color: var(--violet);
  }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

  .btn {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 12px 20px;
    border-radius: 4px;
    border: none;
    cursor: pointer;
  }
  .btn-primary { background: var(--violet); color: var(--ink); }
  .btn-ghost { background: transparent; color: var(--bone-dim); border: 1px solid var(--line); }
  .btn-row { display: flex; gap: 10px; margin-top: 6px; }

  .back {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--bone-dim);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 16px;
  }

  /* --- Chat --- */
  .chat-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .chat-header .name { font-family: 'Fraunces', serif; font-size: 20px; font-weight: 600; }
  .chat-log {
    display: flex; flex-direction: column; gap: 12px;
    min-height: 300px;
    margin-bottom: 16px;
  }
  .bubble {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 14px;
    line-height: 1.5;
  }
  .bubble.user {
    align-self: flex-end;
    background: var(--violet);
    color: var(--ink);
  }
  .bubble.char {
    align-self: flex-start;
    background: var(--ink-2);
    border: 1px solid var(--line);
  }
  .bubble.thinking { color: var(--bone-dim); font-style: italic; }
  .scene-bubble {
    align-self: center;
    max-width: 92%;
    text-align: center;
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 14px;
    color: var(--gold);
    line-height: 1.6;
    padding: 10px 16px;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    margin-bottom: 4px;
  }
  .chat-input { display: flex; gap: 10px; position: sticky; bottom: 20px; }
  .chat-input input {
    flex: 1;
    background: var(--ink-2);
    border: 1px solid var(--line);
    border-radius: 24px;
    color: var(--bone);
    padding: 12px 18px;
    font-size: 14px;
  }
  .chat-input input:focus { outline: none; border-color: var(--violet); }
  .send-btn {
    background: var(--violet);
    color: var(--ink);
    border: none;
    border-radius: 50%;
    width: 44px; height: 44px;
    cursor: pointer;
    font-size: 16px;
  }
  .send-btn:disabled { opacity: 0.4; cursor: default; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="eyebrow">Códice · fichas de personaje</div>
    <div class="header-row">
      <h1 id="headerTitle">Tu bestiario</h1>
      <button class="persona-btn" id="personaBtn" title="Sé quien quieras">◈ Tú</button>
    </div>
  </header>
  <main id="main"></main>
</div>

<script>
// Pega aquí la URL de tu Cloudflare Worker (paso siguiente en la guía)
const WORKER_URL = "https://codice-proxy.danieltolaba487.workers.dev";

const state = {
  view: 'roster', // roster | form | worldForm | persona | chat
  rosterTab: 'characters', // characters | worlds
  characters: [],
  worlds: [],
  activeId: null,
  userPersona: null, // { nombre, tipo, apariencia, descripcion }
};

// --- Guardado permanente en el teléfono (localStorage) ---
const STORAGE_KEY = 'codice-data-v1';

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      characters: state.characters,
      worlds: state.worlds,
      userPersona: state.userPersona,
    }));
  } catch (err) {
    console.error('No se pudo guardar:', err);
  }
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const data = JSON.parse(raw);
    state.characters = data.characters || [];
    state.worlds = data.worlds || [];
    state.userPersona = data.userPersona || null;
  } catch (err) {
    console.error('No se pudo cargar lo guardado:', err);
  }
}

function sigilColor(name) {
  let hash = 0;
  for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
  const hue = Math.abs(hash) % 360;
  return `hsl(${hue}, 45%, 42%)`;
}

function render() {
  const main = document.getElementById('main');
  const title = document.getElementById('headerTitle');
  const personaBtn = document.getElementById('personaBtn');
  personaBtn.classList.toggle('set', !!state.userPersona);
  personaBtn.onclick = () => { state.view = 'persona'; render(); };
  main.innerHTML = '';

  if (state.view === 'roster') {
    title.textContent = state.rosterTab === 'worlds' ? 'Tus mundos' : 'Tu bestiario';
    renderRoster(main);
  } else if (state.view === 'form') {
    title.textContent = 'Nueva ficha';
    renderForm(main);
  } else if (state.view === 'worldForm') {
    title.textContent = 'Nuevo mundo';
    renderWorldForm(main);
  } else if (state.view === 'persona') {
    title.textContent = 'Tu personaje';
    renderPersonaForm(main);
  } else if (state.view === 'chat') {
    title.textContent = 'En conversación';
    renderChat(main);
  }
}

function renderRoster(main) {
  const tabs = document.createElement('div');
  tabs.className = 'tabs';
  tabs.innerHTML = `
    <button class="tab-btn ${state.rosterTab === 'characters' ? 'active' : ''}" id="tabChars">Personajes</button>
    <button class="tab-btn ${state.rosterTab === 'worlds' ? 'active' : ''}" id="tabWorlds">Mundos</button>
  `;
  main.appendChild(tabs);
  tabs.querySelector('#tabChars').onclick = () => { state.rosterTab = 'characters'; render(); };
  tabs.querySelector('#tabWorlds').onclick = () => { state.rosterTab = 'worlds'; render(); };

  if (state.userPersona && state.rosterTab === 'characters') {
    const banner = document.createElement('div');
    banner.className = 'persona-banner';
    banner.innerHTML = `Interactuando como <b>${escapeHtml(state.userPersona.nombre)}</b><span id="editPersona">editar</span>`;
    main.appendChild(banner);
    banner.querySelector('#editPersona').onclick = () => { state.view = 'persona'; render(); };
  }

  if (state.rosterTab === 'worlds') {
    renderWorldsList(main);
    return;
  }

  if (state.characters.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.innerHTML = `<div style="font-size:32px;">◆</div><p>Aún no hay personajes. Crea el primero con el botón +</p>`;
    main.appendChild(empty);
  } else {
    const roster = document.createElement('div');
    roster.className = 'roster';
    state.characters.forEach(c => {
      const item = document.createElement('div');
      item.className = 'roster-item';
      item.innerHTML = `
        <div class="sigil" style="background:${sigilColor(c.nombre)}"></div>
        <div class="meta">
          <div class="name">${escapeHtml(c.nombre)}</div>
          <div class="sub">${escapeHtml(c.etiquetas || 'sin etiquetas')}${c.worldId ? ' · ◇ ' + escapeHtml((state.worlds.find(w => w.id === c.worldId) || {}).nombre || '') : ''}</div>
        </div>
        <button class="delete-btn" title="Eliminar">🗑</button>
        <div class="arrow">→</div>
      `;
      item.onclick = () => { state.activeId = c.id; state.view = 'chat'; render(); };
      item.querySelector('.delete-btn').onclick = (e) => {
        e.stopPropagation();
        if (confirm(`¿Eliminar a ${c.nombre}? Esto borra también su conversación.`)) {
          state.characters = state.characters.filter(x => x.id !== c.id);
          saveState();
          render();
        }
      };
      roster.appendChild(item);
    });
    main.appendChild(roster);
  }
  const fab = document.createElement('button');
  fab.className = 'fab';
  fab.textContent = '+';
  fab.onclick = () => { state.view = 'form'; render(); };
  main.appendChild(fab);
}

function renderWorldsList(main) {
  if (state.worlds.length === 0) {
    main.innerHTML += `<div class="empty">
      <div style="font-size:32px;">◇</div>
      <p>Aún no hay mundos. Crea uno con el botón +</p>
    </div>`;
  } else {
    const roster = document.createElement('div');
    roster.className = 'roster';
    state.worlds.forEach(w => {
      const item = document.createElement('div');
      item.className = 'roster-item';
      item.innerHTML = `
        <div class="sigil" style="background:${sigilColor(w.nombre)}"></div>
        <div class="meta">
          <div class="name">${escapeHtml(w.nombre)}</div>
          <div class="sub">${escapeHtml(w.epoca || '—')} · ${escapeHtml(w.etiquetas || 'sin etiquetas')}</div>
        </div>
        <div class="arrow">✎</div>
      `;
      item.onclick = () => { state.activeId = w.id; state.view = 'worldForm'; render(); };
      roster.appendChild(item);
    });
    main.appendChild(roster);
  }
  const fab = document.createElement('button');
  fab.className = 'fab';
  fab.textContent = '+';
  fab.onclick = () => { state.activeId = null; state.view = 'worldForm'; render(); };
  main.appendChild(fab);
}

function renderWorldForm(main) {
  const editing = state.worlds.find(w => w.id === state.activeId);
  const back = document.createElement('div');
  back.className = 'back';
  back.innerHTML = '← volver';
  back.onclick = () => { state.view = 'roster'; render(); };
  main.appendChild(back);

  const w = editing || {};
  const wrap = document.createElement('div');
  wrap.innerHTML = `
    <div class="field"><label>Nombre del mundo</label><input id="w-nombre" placeholder="Ej. Nueva Elysia, Año 2 D.C. (después del colapso)" value="${escapeHtml(w.nombre || '')}"></div>
    <div class="field"><label>Época / ambientación</label><input id="w-epoca" placeholder="Ej. post-apocalíptico, medieval, cyberpunk..." value="${escapeHtml(w.epoca || '')}"></div>
    <div class="field">
      <label>Descripción</label>
      <textarea id="w-descripcion" rows="8" placeholder="Todo lo que la IA debe saber de este mundo: cómo es, qué lo hace distinto, lugares importantes, personajes que podrían aparecer, reglas, eventos clave, restricciones...">${escapeHtml(w.descripcion || '')}</textarea>
    </div>
    <div class="field">
      <label>Prompt individual</label>
      <textarea id="w-prompt" rows="6" placeholder="Instrucciones directas para la IA, en tus propias palabras (tono, formato de diálogos, qué NUNCA debe hacer, etc.) — se envían tal cual, con máxima prioridad.">${escapeHtml(w.prompt || '')}</textarea>
    </div>
    <div class="field"><label>Escena de apertura</label><textarea id="w-escena" rows="3" placeholder="Ej. Las sirenas de alerta llevan sonando toda la noche. El olor a humo llega incluso hasta aquí...">${escapeHtml(w.escena || '')}</textarea></div>
    <div class="field"><label>Etiquetas</label><input id="w-etiquetas" placeholder="zombies, sci-fi, invasión..." value="${escapeHtml(w.etiquetas || '')}"></div>
    <div class="btn-row">
      <button class="btn btn-primary" id="saveWorldBtn">Guardar mundo</button>
      ${editing ? '<button class="btn btn-ghost" id="deleteWorldBtn">Eliminar</button>' : ''}
    </div>
  `;
  main.appendChild(wrap);

  document.getElementById('saveWorldBtn').onclick = () => {
    const nombre = document.getElementById('w-nombre').value.trim();
    if (!nombre) { alert('El nombre del mundo es obligatorio.'); return; }
    const data = {
      nombre,
      epoca: document.getElementById('w-epoca').value.trim(),
      descripcion: document.getElementById('w-descripcion').value.trim(),
      prompt: document.getElementById('w-prompt').value.trim(),
      escena: document.getElementById('w-escena').value.trim(),
      etiquetas: document.getElementById('w-etiquetas').value.trim(),
    };
    if (editing) {
      Object.assign(editing, data);
    } else {
      state.worlds.push({ id: Date.now().toString(), ...data });
    }
    saveState();
    state.view = 'roster';
    render();
  };
  const delBtn = document.getElementById('deleteWorldBtn');
  if (delBtn) delBtn.onclick = () => {
    state.worlds = state.worlds.filter(x => x.id !== editing.id);
    state.characters.forEach(c => { if (c.worldId === editing.id) c.worldId = null; });
    saveState();
    state.view = 'roster';
    render();
  };
}

function renderPersonaForm(main) {
  const back = document.createElement('div');
  back.className = 'back';
  back.innerHTML = '← volver';
  back.onclick = () => { state.view = 'roster'; render(); };
  main.appendChild(back);

  const p = state.userPersona || {};
  const wrap = document.createElement('div');
  wrap.innerHTML = `
    <p style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--gold);margin-bottom:18px;line-height:1.6;">
      Sé quien quieras: un hombre, una mujer, un animal, un híbrido, un semi-humano, un monstruo... lo que imagines. Así es como los personajes te van a ver a ti.
    </p>
    <div class="field">
      <label>¿Quién eres tú en las conversaciones?</label>
      <input id="p-nombre" placeholder="Nombre de tu personaje" value="${escapeHtml(p.nombre || '')}">
    </div>
    <div class="field"><label>Raza</label><input id="p-tipo" placeholder="Ej. humano, animal, híbrido, semi-humano, monstruo, licántropo, dragón..." value="${escapeHtml(p.tipo || '')}"></div>
    <div class="row2">
      <div class="field"><label>Género</label><input id="p-genero" value="${escapeHtml(p.genero || '')}"></div>
      <div class="field"><label>Edad</label><input id="p-edad" value="${escapeHtml(p.edad || '')}"></div>
    </div>
    <div class="field"><label>Apariencia</label><textarea id="p-apariencia" rows="3" placeholder="Rasgos físicos, complexión, altura en metros...">${escapeHtml(p.apariencia || '')}</textarea></div>
    <div class="field"><label>Descripción / personalidad</label><textarea id="p-descripcion" rows="4">${escapeHtml(p.descripcion || '')}</textarea></div>
    <div class="row2">
      <div class="field"><label>Gustos</label><textarea id="p-gustos" rows="2">${escapeHtml(p.gustos || '')}</textarea></div>
      <div class="field"><label>Disgustos</label><textarea id="p-disgustos" rows="2">${escapeHtml(p.disgustos || '')}</textarea></div>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" id="savePersonaBtn">Guardar</button>
      ${state.userPersona ? '<button class="btn btn-ghost" id="clearPersonaBtn">Quitar personaje</button>' : ''}
    </div>
    <p style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--bone-dim);margin-top:14px;line-height:1.6;">
      Esta ficha se usa en TODAS tus conversaciones: los personajes sabrán que eres tú, no "el usuario" genérico. Déjala vacía y guarda sin nombre si prefieres no usar esta función.
    </p>
  `;
  main.appendChild(wrap);

  document.getElementById('savePersonaBtn').onclick = () => {
    const nombre = document.getElementById('p-nombre').value.trim();
    if (!nombre) {
      state.userPersona = null;
    } else {
      state.userPersona = {
        nombre,
        tipo: document.getElementById('p-tipo').value.trim(),
        genero: document.getElementById('p-genero').value.trim(),
        edad: document.getElementById('p-edad').value.trim(),
        apariencia: document.getElementById('p-apariencia').value.trim(),
        descripcion: document.getElementById('p-descripcion').value.trim(),
        gustos: document.getElementById('p-gustos').value.trim(),
        disgustos: document.getElementById('p-disgustos').value.trim(),
      };
    }
    saveState();
    state.view = 'roster';
    render();
  };
  const clearBtn = document.getElementById('clearPersonaBtn');
  if (clearBtn) clearBtn.onclick = () => { state.userPersona = null; saveState(); state.view = 'roster'; render(); };
}

function renderForm(main) {
  const back = document.createElement('div');
  back.className = 'back';
  back.innerHTML = '← volver';
  back.onclick = () => { state.view = 'roster'; render(); };
  main.appendChild(back);

  const wrap = document.createElement('div');
  wrap.innerHTML = `
    <div class="field"><label>Nombre</label><input id="f-nombre" placeholder="Ej. Sigurd Kolbjørnsen"></div>
    <div class="field"><label>Apariencia</label><textarea id="f-apariencia" rows="3" placeholder="Rasgos físicos distintivos, complexión, altura en metros..."></textarea></div>
    <div class="field"><label>Descripción</label><textarea id="f-descripcion" rows="4" placeholder="Personalidad, historia, contradicciones..."></textarea></div>
    <div class="field"><label>Saludo inicial</label><textarea id="f-saludo" rows="2" placeholder="Lo primero que dice tu personaje al empezar a hablar contigo..."></textarea></div>
    <div class="field"><label>Etiquetas</label><input id="f-etiquetas" placeholder="fantasía, híbrido, inmortal..."></div>
    <div class="field">
      <label>Mundo (opcional)</label>
      <select id="f-mundo">
        <option value="">— Sin mundo específico —</option>
        ${state.worlds.map(w => `<option value="${w.id}">${escapeHtml(w.nombre)}</option>`).join('')}
      </select>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" id="saveBtn">Guardar ficha</button>
      <button class="btn btn-ghost" id="cancelBtn">Cancelar</button>
    </div>
  `;
  main.appendChild(wrap);

  document.getElementById('cancelBtn').onclick = () => { state.view = 'roster'; render(); };
  document.getElementById('saveBtn').onclick = () => {
    const nombre = document.getElementById('f-nombre').value.trim();
    if (!nombre) { alert('El nombre es obligatorio.'); return; }
    const character = {
      id: Date.now().toString(),
      nombre,
      apariencia: document.getElementById('f-apariencia').value.trim(),
      descripcion: document.getElementById('f-descripcion').value.trim(),
      etiquetas: document.getElementById('f-etiquetas').value.trim(),
      saludo: document.getElementById('f-saludo').value.trim(),
      worldId: document.getElementById('f-mundo').value || null,
      messages: [],
    };
    state.characters.push(character);
    saveState();
    state.view = 'roster';
    render();
  };
}

function buildSystemPrompt(c) {
  let prompt = `Estás interpretando al personaje "${c.nombre}" en un chat de rol. Responde SIEMPRE en primera persona, dentro del personaje, en español.

Ficha del personaje:
- Apariencia: ${c.apariencia || 'no especificada'}
- Descripción/personalidad: ${c.descripcion || 'no especificada'}
- Etiquetas: ${c.etiquetas || 'ninguna'}`;

  if (c.worldId) {
    const w = state.worlds.find(x => x.id === c.worldId);
    if (w) {
      prompt += `

Esta conversación ocurre dentro de un mundo específico, y debes tenerlo en cuenta en cada respuesta:
- Mundo: ${w.nombre}
- Época/ambientación: ${w.epoca || 'no especificada'}
- Descripción: ${w.descripcion || 'no especificada'}`;
      if (w.prompt) prompt += `

Instrucciones adicionales de este mundo (máxima prioridad, síguelas al pie de la letra):
${w.prompt}`;
    }
  }

  if (state.userPersona) {
    const p = state.userPersona;
    prompt += `

La persona con la que hablas NO es "el usuario" genérico — es otro personaje dentro de esta historia:
- Nombre: ${p.nombre}
- Raza: ${p.tipo || 'no especificada'}
- Género: ${p.genero || 'no especificado'}
- Edad: ${p.edad || 'no especificada'}
- Apariencia: ${p.apariencia || 'no especificada'}
- Descripción/personalidad: ${p.descripcion || 'no especificada'}
- Gustos: ${p.gustos || 'no especificados'}
- Disgustos: ${p.disgustos || 'no especificados'}
Dirígete a esta persona por su nombre y trátala como a ese personaje, no como a un usuario externo.`;
  }

  prompt += `

Mantén las respuestas breves y naturales, como en una conversación real. No rompas el personaje ni menciones que eres una IA.`;

  if (c.saludo || (c.worldId && state.worlds.find(w => w.id === c.worldId)?.escena)) {
    prompt += ` Nota: la persona ya vio la escena de apertura y/o tu saludo inicial antes de escribirte — no los repitas, continúa la conversación desde ahí de forma natural.`;
  }
  return prompt;
}

function renderChat(main) {
  const c = state.characters.find(x => x.id === state.activeId);
  if (!c) { state.view = 'roster'; render(); return; }

  const back = document.createElement('div');
  back.className = 'back';
  back.innerHTML = '← al bestiario';
  back.onclick = () => { state.view = 'roster'; render(); };
  main.appendChild(back);

  const wrap = document.createElement('div');
  wrap.innerHTML = `
    <div class="chat-header">
      <div class="sigil" style="width:32px;height:32px;background:${sigilColor(c.nombre)}"></div>
      <div class="name">${escapeHtml(c.nombre)}</div>
    </div>
    <div class="chat-log" id="chatLog"></div>
    <div class="chat-input">
      <input id="chatInput" placeholder="Escribe algo...">
      <button class="send-btn" id="sendBtn">→</button>
    </div>
  `;
  main.appendChild(wrap);

  renderMessages(c);

  const input = document.getElementById('chatInput');
  const sendBtn = document.getElementById('sendBtn');

  async function send() {
    const text = input.value.trim();
    if (!text) return;
    c.messages.push({ role: 'user', content: text });
    saveState();
    input.value = '';
    renderMessages(c);
    sendBtn.disabled = true;

    const log = document.getElementById('chatLog');
    const thinkingEl = document.createElement('div');
    thinkingEl.className = 'bubble char thinking';
    thinkingEl.textContent = `${c.nombre} está escribiendo...`;
    log.appendChild(thinkingEl);
    log.scrollTop = log.scrollHeight;

    try {
      const response = await fetch(WORKER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 1000,
          system: buildSystemPrompt(c),
          messages: c.messages.map(m => ({ role: m.role, content: m.content })),
        })
      });
      const data = await response.json();
      const reply = data.choices && data.choices[0] ? data.choices[0].message.content : '(sin respuesta)';
      c.messages.push({ role: 'assistant', content: reply });
    } catch (err) {
      c.messages.push({ role: 'assistant', content: '(error al conectar con la IA)' });
    }
    saveState();
    sendBtn.disabled = false;
    renderMessages(c);
  }

  sendBtn.onclick = send;
  input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
}

function renderMessages(c) {
  const log = document.getElementById('chatLog');
  if (!log) return;
  log.innerHTML = '';
  if (c.messages.length === 0) {
    const world = c.worldId ? state.worlds.find(w => w.id === c.worldId) : null;
    if (world && world.escena) {
      const scene = document.createElement('div');
      scene.className = 'scene-bubble';
      scene.textContent = world.escena;
      log.appendChild(scene);
    }
    if (c.saludo) {
      const greet = document.createElement('div');
      greet.className = 'bubble char';
      greet.textContent = c.saludo;
      log.appendChild(greet);
    }
    if (!world?.escena && !c.saludo) {
      const hint = document.createElement('div');
      hint.className = 'bubble char thinking';
      hint.textContent = `Empieza la conversación con ${c.nombre}...`;
      log.appendChild(hint);
    }
  }
  c.messages.forEach(m => {
    const b = document.createElement('div');
    b.className = 'bubble ' + (m.role === 'user' ? 'user' : 'char');
    b.textContent = m.content;
    log.appendChild(b);
  });
  log.scrollTop = log.scrollHeight;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

loadState();
render();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
