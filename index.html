<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Códice</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#16151f">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #16151f;
    --ink-2: #1f1e2c;
    --ink-3: #2a2938;
    --bone: #ece6d9;
    --bone-dim: #a9a396;
    --violet: #8d7bf0;
    --gold: #c9a876;
    --line: #38364a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--ink);
    color: var(--bone);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 900px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 28px 24px 20px;
    border-bottom: 1px solid var(--line);
  }
  header .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--gold);
  }
  header h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 32px;
    margin-top: 4px;
  }
  main { flex: 1; padding: 20px; }

  /* --- Roster --- */
  .roster { display: flex; flex-direction: column; gap: 10px; }
  .roster-item {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 16px;
    background: var(--ink-2);
    border: 1px solid var(--line);
    border-radius: 4px;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .roster-item:hover { border-color: var(--violet); }
  .sigil {
    width: 40px; height: 40px;
    border-radius: 3px;
    flex-shrink: 0;
  }
  .roster-item .meta { flex: 1; min-width: 0; }
  .roster-item .name { font-family: 'Fraunces', serif; font-size: 17px; font-weight: 600; }
  .roster-item .sub { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--bone-dim); margin-top: 2px; }
  .roster-item .arrow { color: var(--bone-dim); font-size: 18px; }

  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--bone-dim);
  }
  .empty p { font-family: 'JetBrains Mono', monospace; font-size: 13px; margin-top: 6px; }

  .fab {
    position: fixed;
    bottom: 24px; right: calc(50% - 450px + 24px);
    background: var(--violet);
    color: var(--ink);
    border: none;
    width: 54px; height: 54px;
    border-radius: 50%;
    font-size: 26px;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(141,123,240,0.4);
  }
  @media (max-width: 900px) {
    .fab { right: 24px; }
  }

  /* --- Form --- */
  .field { margin-bottom: 18px; }
  .field label {
    display: block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 6px;
  }
  .field input, .field textarea {
    width: 100%;
    background: var(--ink-2);
    border: 1px solid var(--line);
    border-radius: 4px;
    color: var(--bone);
    padding: 11px 12px;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    resize: vertical;
  }
  .field input:focus, .field textarea:focus {
    outline: none;
    border-color: var(--violet);
  }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

  .btn {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 12px 20px;
    border-radius: 4px;
    border: none;
    cursor: pointer;
  }
  .btn-primary { background: var(--violet); color: var(--ink); }
  .btn-ghost { background: transparent; color: var(--bone-dim); border: 1px solid var(--line); }
  .btn-row { display: flex; gap: 10px; margin-top: 6px; }

  .back {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--bone-dim);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 16px;
  }

  /* --- Chat --- */
  .chat-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .chat-header .name { font-family: 'Fraunces', serif; font-size: 20px; font-weight: 600; }
  .chat-log {
    display: flex; flex-direction: column; gap: 12px;
    min-height: 300px;
    margin-bottom: 16px;
  }
  .bubble {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 14px;
    line-height: 1.5;
  }
  .bubble.user {
    align-self: flex-end;
    background: var(--violet);
    color: var(--ink);
  }
  .bubble.char {
    align-self: flex-start;
    background: var(--ink-2);
    border: 1px solid var(--line);
  }
  .bubble.thinking { color: var(--bone-dim); font-style: italic; }
  .chat-input { display: flex; gap: 10px; position: sticky; bottom: 20px; }
  .chat-input input {
    flex: 1;
    background: var(--ink-2);
    border: 1px solid var(--line);
    border-radius: 24px;
    color: var(--bone);
    padding: 12px 18px;
    font-size: 14px;
  }
  .chat-input input:focus { outline: none; border-color: var(--violet); }
  .send-btn {
    background: var(--violet);
    color: var(--ink);
    border: none;
    border-radius: 50%;
    width: 44px; height: 44px;
    cursor: pointer;
    font-size: 16px;
  }
  .send-btn:disabled { opacity: 0.4; cursor: default; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="eyebrow">Códice · fichas de personaje</div>
    <h1 id="headerTitle">Tu bestiario</h1>
  </header>
  <main id="main"></main>
</div>

<script>
const state = {
  view: 'roster', // roster | form | chat
  characters: [],
  activeId: null,
};

function sigilColor(name) {
  let hash = 0;
  for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
  const hue = Math.abs(hash) % 360;
  return `hsl(${hue}, 45%, 42%)`;
}

function render() {
  const main = document.getElementById('main');
  const title = document.getElementById('headerTitle');
  main.innerHTML = '';

  if (state.view === 'roster') {
    title.textContent = 'Tu bestiario';
    renderRoster(main);
  } else if (state.view === 'form') {
    title.textContent = 'Nueva ficha';
    renderForm(main);
  } else if (state.view === 'chat') {
    title.textContent = 'En conversación';
    renderChat(main);
  }
}

function renderRoster(main) {
  if (state.characters.length === 0) {
    main.innerHTML = `<div class="empty">
      <div style="font-size:32px;">◆</div>
      <p>Aún no hay personajes. Crea el primero con el botón +</p>
    </div>`;
  } else {
    const roster = document.createElement('div');
    roster.className = 'roster';
    state.characters.forEach(c => {
      const item = document.createElement('div');
      item.className = 'roster-item';
      item.innerHTML = `
        <div class="sigil" style="background:${sigilColor(c.nombre)}"></div>
        <div class="meta">
          <div class="name">${escapeHtml(c.nombre)}</div>
          <div class="sub">${escapeHtml(c.genero || '—')} · ${escapeHtml(c.edad || '—')} · ${escapeHtml(c.etiquetas || 'sin etiquetas')}</div>
        </div>
        <div class="arrow">→</div>
      `;
      item.onclick = () => { state.activeId = c.id; state.view = 'chat'; render(); };
      roster.appendChild(item);
    });
    main.appendChild(roster);
  }
  const fab = document.createElement('button');
  fab.className = 'fab';
  fab.textContent = '+';
  fab.onclick = () => { state.view = 'form'; render(); };
  main.appendChild(fab);
}

function renderForm(main) {
  const back = document.createElement('div');
  back.className = 'back';
  back.innerHTML = '← volver';
  back.onclick = () => { state.view = 'roster'; render(); };
  main.appendChild(back);

  const wrap = document.createElement('div');
  wrap.innerHTML = `
    <div class="field"><label>Nombre</label><input id="f-nombre" placeholder="Ej. Sigurd Kolbjørnsen"></div>
    <div class="row2">
      <div class="field"><label>Género</label><input id="f-genero"></div>
      <div class="field"><label>Edad</label><input id="f-edad"></div>
    </div>
    <div class="field"><label>Apariencia</label><textarea id="f-apariencia" rows="3" placeholder="Rasgos físicos distintivos, complexión, altura en metros..."></textarea></div>
    <div class="field"><label>Descripción</label><textarea id="f-descripcion" rows="4" placeholder="Personalidad, historia, contradicciones..."></textarea></div>
    <div class="row2">
      <div class="field"><label>Gustos</label><textarea id="f-gustos" rows="2"></textarea></div>
      <div class="field"><label>Disgustos</label><textarea id="f-disgustos" rows="2"></textarea></div>
    </div>
    <div class="field"><label>Etiquetas</label><input id="f-etiquetas" placeholder="fantasía, híbrido, inmortal..."></div>
    <div class="btn-row">
      <button class="btn btn-primary" id="saveBtn">Guardar ficha</button>
      <button class="btn btn-ghost" id="cancelBtn">Cancelar</button>
    </div>
  `;
  main.appendChild(wrap);

  document.getElementById('cancelBtn').onclick = () => { state.view = 'roster'; render(); };
  document.getElementById('saveBtn').onclick = () => {
    const nombre = document.getElementById('f-nombre').value.trim();
    if (!nombre) { alert('El nombre es obligatorio.'); return; }
    const character = {
      id: Date.now().toString(),
      nombre,
      genero: document.getElementById('f-genero').value.trim(),
      edad: document.getElementById('f-edad').value.trim(),
      apariencia: document.getElementById('f-apariencia').value.trim(),
      descripcion: document.getElementById('f-descripcion').value.trim(),
      gustos: document.getElementById('f-gustos').value.trim(),
      disgustos: document.getElementById('f-disgustos').value.trim(),
      etiquetas: document.getElementById('f-etiquetas').value.trim(),
      messages: [],
    };
    state.characters.push(character);
    state.view = 'roster';
    render();
  };
}

function buildSystemPrompt(c) {
  return `Estás interpretando al personaje "${c.nombre}" en un chat de rol. Responde SIEMPRE en primera persona, dentro del personaje, en español.

Ficha del personaje:
- Género: ${c.genero || 'no especificado'}
- Edad: ${c.edad || 'no especificada'}
- Apariencia: ${c.apariencia || 'no especificada'}
- Descripción/personalidad: ${c.descripcion || 'no especificada'}
- Gustos: ${c.gustos || 'no especificados'}
- Disgustos: ${c.disgustos || 'no especificados'}
- Etiquetas: ${c.etiquetas || 'ninguna'}

Mantén las respuestas breves y naturales, como en una conversación real. No rompas el personaje ni menciones que eres una IA.`;
}

function renderChat(main) {
  const c = state.characters.find(x => x.id === state.activeId);
  if (!c) { state.view = 'roster'; render(); return; }

  const back = document.createElement('div');
  back.className = 'back';
  back.innerHTML = '← al bestiario';
  back.onclick = () => { state.view = 'roster'; render(); };
  main.appendChild(back);

  const wrap = document.createElement('div');
  wrap.innerHTML = `
    <div class="chat-header">
      <div class="sigil" style="width:32px;height:32px;background:${sigilColor(c.nombre)}"></div>
      <div class="name">${escapeHtml(c.nombre)}</div>
    </div>
    <div class="chat-log" id="chatLog"></div>
    <div class="chat-input">
      <input id="chatInput" placeholder="Escribe algo...">
      <button class="send-btn" id="sendBtn">→</button>
    </div>
  `;
  main.appendChild(wrap);

  renderMessages(c);

  const input = document.getElementById('chatInput');
  const sendBtn = document.getElementById('sendBtn');

  async function send() {
    const text = input.value.trim();
    if (!text) return;
    c.messages.push({ role: 'user', content: text });
    input.value = '';
    renderMessages(c);
    sendBtn.disabled = true;

    const log = document.getElementById('chatLog');
    const thinkingEl = document.createElement('div');
    thinkingEl.className = 'bubble char thinking';
    thinkingEl.textContent = `${c.nombre} está escribiendo...`;
    log.appendChild(thinkingEl);
    log.scrollTop = log.scrollHeight;

    try {
      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 1000,
          system: buildSystemPrompt(c),
          messages: c.messages.map(m => ({ role: m.role, content: m.content })),
        })
      });
      const data = await response.json();
      const textBlock = (data.content || []).find(b => b.type === 'text');
      const reply = textBlock ? textBlock.text : '(sin respuesta)';
      c.messages.push({ role: 'assistant', content: reply });
    } catch (err) {
      c.messages.push({ role: 'assistant', content: '(error al conectar con la IA)' });
    }
    sendBtn.disabled = false;
    renderMessages(c);
  }

  sendBtn.onclick = send;
  input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
}

function renderMessages(c) {
  const log = document.getElementById('chatLog');
  if (!log) return;
  log.innerHTML = '';
  if (c.messages.length === 0) {
    const hint = document.createElement('div');
    hint.className = 'bubble char thinking';
    hint.textContent = `Empieza la conversación con ${c.nombre}...`;
    log.appendChild(hint);
  }
  c.messages.forEach(m => {
    const b = document.createElement('div');
    b.className = 'bubble ' + (m.role === 'user' ? 'user' : 'char');
    b.textContent = m.content;
    log.appendChild(b);
  });
  log.scrollTop = log.scrollHeight;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

render();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
